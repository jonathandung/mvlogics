name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    permissions:
      security-events: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{github.event.pull_request.head.sha || github.sha}}
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      with:
        enable-cache: false
    - run: uvx ruff check --output-format github
    - run: uvx ty check --output-format github
    - uses: jonathandung/check-empty@6b24e2c247289fc39c89708eb1963d7dc10fdd85
      with:
        filenames: mvlogics/py.typed
    - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff
      with:
        globs: |
          .github/**/*.md
          *.md
    - run: uv audit --preview-features audit-command
    - uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99
    - run: uv build
    timeout-minutes: 3
