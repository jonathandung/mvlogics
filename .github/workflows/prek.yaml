name: Update prek hooks
on:
  schedule: [{cron: "0 0 * * 1"}]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # zizmor: ignore[artipacked]
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519
        with:
          tool: prek
      - run: prek update
      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1
        with:
          assignees: jonathandung
          branch: prek
          commit-message: update prek hooks
          delete-branch: true
          sign-commits: true
          signoff: true
          title: Weekly prek hooks update
    timeout-minutes: 3
