[build-system]
requires = ["uv_build>=0.13.6"]
build-backend = "uv_build"

[dependency-groups]
docs = ["sphinx==9.2.0; python_version >= '3.13'", "sphinx==9.1.0; python_version < '3.13'", "furo==2025.12.19", "sphinx-copybutton==0.5.2", "sphinx-notfound-page==1.1.0", "sphinx-autoapi==3.8.1", "myst-parser==5.1.0"]

[project]
name = "mvlogics"
version = "1.0.6"
authors = [{name = "Jonathan Dung", email = "jonathandung@yahoo.com"}]
maintainers = [{name = "Jonathan Dung", email = "jonathandung@yahoo.com"}]
description = "Multi-valued logics."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "AUTHORS.md"]
keywords = ["mathematical", "object-oriented", "logic", "propositional calculi"]
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14", "Programming Language :: Python :: 3.15", "Programming Language :: Python :: 3.16", "Programming Language :: Python :: Implementation :: CPython", "Operating System :: OS Independent", "Development Status :: 5 - Production/Stable", "Intended Audience :: Education", "Intended Audience :: Science/Research", "Framework :: Sphinx", "Topic :: Education", "Topic :: Software Development :: Libraries :: Python Modules", "Topic :: Scientific/Engineering :: Mathematics", "Natural Language :: English", "Typing :: Typed"]

[project.urls]
Homepage = "https://github.com/jonathandung/mvlogics"
Documentation = "https://mvlogics.readthedocs.io/en/stable/api/index.html"
Repository = "https://github.com/jonathandung/mvlogics.git"
Issues = "https://github.com/jonathandung/mvlogics/issues"
Download = "https://pypi.org/project/mvlogics/#files"
"Release Notes" = "https://github.com/jonathandung/mvlogics/releases"

[tool.ruff]
required-version = ">=0.17.3"
target-version = "py312"

[tool.ruff.lint]
ignore = ["D", "ambiguous-variable-name", "blank-line-between-methods", "blank-lines-after-function-or-class", "blank-lines-before-nested-definition", "blank-lines-top-level", "docstring-in-stub", "f-string-in-exception", "implicit-namespace-package", "invalid-class-name", "line-too-long", "missing-whitespace-around-arithmetic-operator", "missing-whitespace-around-bitwise-or-shift-operator", "missing-whitespace-around-parameter-equals", "multiple-statements-on-one-line-colon", "multiple-statements-on-one-line-semicolon", "mutable-class-default", "non-empty-init-module", "non-lowercase-variable-in-function", "private-member-access", "raise-vanilla-args", "raw-string-in-exception", "too-few-spaces-before-inline-comment", "unsorted-imports"]
select = ["ALL"]
preview = true
typing-extensions = false

[tool.ruff.lint.per-file-ignores]
"mvlogics/*.py" = ["ANN", "PYI"]
"mvlogics/__init__.py" = ["unused-import", "magic-value-comparison"]
"!mvlogics/__init__.py" = ["missing-copyright-notice"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["__import__"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
multiline-quotes = "single"
docstring-quotes = "single"

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.format]
quote-style = "single"

[tool.ty.analysis]
respect-type-ignore-comments = false

[tool.ty.environment]
python-version = "3.12"
python-platform = "all"

[tool.ty.rules]
unused-ignore-comment = "error"

[tool.ty.src]
include = ["mvlogics"]
exclude = ["mvlogics/__init__.py"]

[tool.uv]
preview = true
required-version = ">=0.13.6"

[tool.uv.build-backend]
module-name = "mvlogics"
module-root = ""
